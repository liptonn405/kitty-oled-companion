font_family JetBrainsMono Nerd Font
font_size 11.0
background #000000
foreground #7ee787
background_opacity 0.88
cursor #7ee787
cursor_text_color #000000
cursor_shape beam
cursor_blink_interval 0.6
selection_foreground #e5f3e3
selection_background #193820
color0 #000000
color1 #cc241d
color2 #61c96b
color3 #7ee787
color4 #458588
color5 #b16286
color6 #71c49a
color7 #7ee787
color8 #8da18f
color9 #fb4934
color10 #7ee787
color11 #a0eea5
color12 #9bd8b0
color13 #d3869b
color14 #a7f3a0
color15 #a7f3a0
window_padding_width 10
window_margin_width 5
single_window_margin_width 5
window_border_width 1
active_border_color #000000
inactive_border_color #000000
hide_window_decorations yes
enabled_layouts splits,stack
tab_bar_style hidden
enable_audio_bell no
scrollback_lines 10000
remember_window_size no
initial_window_width 140c
initial_window_height 46c
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+z toggle_layout stack
map ctrl+shift+enter launch --location=split --cwd=current
# Replace only the old SYSTEM pane in a running dashboard after reloading config.
map --when-focus-on=title:^SYSTEM$ ctrl+shift+r combine : launch --location=hsplit --keep-focus --env=GRUVBOX_GREETING_DONE=1 --title="WORK / 2" bash -c 'exec bash --rcfile "$GRUVBOX_DESKTOP_DIR/work.bashrc" -i' : close_window
map --when-focus-on=title:^MUSIC$ ctrl+shift+e launch --location=vsplit --bias=34 --title=ROBOT --var=role=robot bash -c 'exec python3 "$GRUVBOX_DESKTOP_DIR/robot_eyes.py"'
color230 #000000
color231 #7ee787
color232 #7ee787
color233 #7ee787
color234 #9bd8b0
color235 #a7f3a0
color236 #8da18f
color237 #71c49a
map --when-focus-on=title:^ROBOT$ ctrl+shift+e combine : launch --location=hsplit --keep-focus --title=ROBOT --var=role=robot bash -c 'exec python3 "$GRUVBOX_DESKTOP_DIR/robot_eyes.py"' : close_window
map --when-focus-on=title:^MUSIC$ ctrl+shift+r combine : launch --location=hsplit --keep-focus --title=MUSIC bash -c 'exec python3 "$GRUVBOX_DESKTOP_DIR/panel.py" music' : close_window
dynamic_background_opacity yes
map --when-focus-on=title:^MUSIC$ ctrl+shift+e launch --location=vsplit --bias=34 --spacing padding=0 --title=ROBOT --var=role=robot bash -c 'exec python3 "$GRUVBOX_DESKTOP_DIR/robot_eyes.py"'
map --when-focus-on=title:^ROBOT$ ctrl+shift+e combine : launch --location=hsplit --keep-focus --spacing padding=0 --title=ROBOT --var=role=robot bash -c 'exec python3 "$GRUVBOX_DESKTOP_DIR/robot_eyes.py"' : close_window
watcher /home/lipton404/.config/kitty/gruvbox-desktop/robot_activity_v3.py
